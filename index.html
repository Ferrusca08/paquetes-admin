<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PackTrack · Admin</title>
<style>
  :root{
    --bg:#0f172a; --bg2:#1e293b; --surface:#ffffff; --surface2:#f8fafc;
    --border:#e2e8f0; --text:#0f172a; --muted:#64748b; --primary:#4f46e5;
    --primary-d:#4338ca; --green:#16a34a; --amber:#d97706; --red:#dc2626;
    --blue:#2563eb; --slate:#475569;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--surface2);color:var(--text);font-size:14px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none}
  input,select{font-family:inherit;font-size:14px}
  a{color:var(--primary)}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e293b,#4f46e5)}
  .login-card{background:#fff;border-radius:16px;padding:40px;width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .login-card .logo{font-size:26px;font-weight:800;text-align:center;margin-bottom:4px}
  .login-card .logo span{color:var(--primary)}
  .login-card .sub{text-align:center;color:var(--muted);margin-bottom:28px;font-size:13px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;transition:border .15s}
  .field input:focus{outline:none;border-color:var(--primary)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;background:var(--primary);color:#fff;transition:background .15s}
  .btn:hover{background:var(--primary-d)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn-block{width:100%}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
  .btn-ghost{background:transparent;color:var(--slate);border:1.5px solid var(--border)}
  .btn-ghost:hover{background:var(--surface2)}
  .btn-danger{background:var(--red)}.btn-danger:hover{background:#b91c1c}
  .err{background:#fef2f2;color:var(--red);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;border:1px solid #fecaca}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:230px;background:var(--bg);color:#cbd5e1;display:flex;flex-direction:column;position:fixed;height:100vh}
  .sidebar .brand{padding:22px 22px;font-size:20px;font-weight:800;color:#fff;border-bottom:1px solid #1e293b}
  .sidebar .brand span{color:#818cf8}
  .nav{padding:14px 12px;flex:1}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:9px;color:#cbd5e1;font-weight:500;cursor:pointer;margin-bottom:3px;transition:background .12s}
  .nav-item:hover{background:#1e293b;color:#fff}
  .nav-item.active{background:var(--primary);color:#fff}
  .nav-item .ico{font-size:17px;width:20px;text-align:center}
  .sidebar .foot{padding:16px;border-top:1px solid #1e293b;font-size:12px;color:#64748b}

  .main{margin-left:230px;flex:1;display:flex;flex-direction:column}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
  .topbar .bsel{display:flex;align-items:center;gap:10px}
  .topbar select{padding:8px 12px;border:1.5px solid var(--border);border-radius:9px;font-weight:600;color:var(--text);background:#fff;min-width:200px}
  .topbar .user{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .content{padding:28px;max-width:1200px;width:100%}
  .page-title{font-size:22px;font-weight:800;margin-bottom:4px}
  .page-sub{color:var(--muted);margin-bottom:24px;font-size:13px}

  /* ---------- CARDS / STATS ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:28px}
  .stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px}
  .stat .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
  .stat .val{font-size:30px;font-weight:800;margin-top:8px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}

  .card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:22px}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  .card-head h3{font-size:15px;font-weight:700}
  .card-body{padding:4px 0}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:11px 20px;border-bottom:1px solid var(--border);background:var(--surface2)}
  td{padding:13px 20px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafbff}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .b-recibido{background:#eff6ff;color:var(--blue)}
  .b-notificado{background:#fffbeb;color:var(--amber)}
  .b-entregado{background:#f0fdf4;color:var(--green)}
  .b-devuelto{background:#f1f5f9;color:var(--slate)}
  .b-expirado{background:#fef2f2;color:var(--red)}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.05em;background:var(--surface2);padding:2px 8px;border-radius:6px}

  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .tab{padding:8px 15px;border-radius:9px;font-weight:600;font-size:13px;background:#fff;border:1.5px solid var(--border);color:var(--slate)}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff}

  .empty{padding:48px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:8px}
  .muted{color:var(--muted)}
  .loading{padding:40px;text-align:center;color:var(--muted)}
  .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- MODAL ---------- */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;align-items:center;justify-content:center;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:440px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 25px 60px rgba(0,0,0,.3)}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--border);font-size:17px;font-weight:700}
  .modal-body{padding:22px 24px}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--bg);color:#fff;padding:13px 18px;border-radius:10px;font-size:14px;z-index:100;opacity:0;transform:translateY(10px);transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.err{background:var(--red)}

  /* ---------- RESPONSIVE ---------- */
  .topbar-left{display:flex;align-items:center;gap:10px}
  .hamburger{display:none;background:transparent;border:none;color:var(--slate);cursor:pointer;padding:6px;border-radius:8px;align-items:center;justify-content:center}
  .hamburger:hover{background:var(--surface2)}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:25}
  @media (max-width:768px){
    .sidebar{transform:translateX(-100%);transition:transform .25s ease;z-index:30}
    .sidebar.open{transform:translateX(0);box-shadow:0 0 50px rgba(0,0,0,.45)}
    .main{margin-left:0}
    .hamburger{display:inline-flex}
    .sidebar-overlay.show{display:block}
    .content{padding:18px 16px}
    .topbar{padding:0 14px}
    .topbar select{min-width:140px}
    .card-body{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .card-head{flex-wrap:wrap;gap:10px}
    .modal{width:100%}
  }
  @media (max-width:520px){
    #userEmail{display:none}
    .topbar select{min-width:108px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .page-title{font-size:19px}
    .row-actions{flex-wrap:wrap}
  }

  /* ---------- CALENDAR ---------- */
  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-cell{min-height:86px;border:1px solid var(--border);border-radius:9px;padding:6px;background:#fff;font-size:11px;overflow:hidden}
  .cal-cell.empty{background:transparent;border:none}
  .cal-cell.has{cursor:pointer;border-color:#dfe3ff}
  .cal-cell.has:hover{background:#fafbff}
  .cal-cell.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
  .cal-d{font-weight:700;font-size:12px;color:var(--slate);margin-bottom:4px}
  .cal-chip{background:#eef0fe;color:var(--primary-d);border-radius:5px;padding:2px 5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .cal-more{color:var(--muted);font-size:10px;font-weight:600}
  @media(max-width:640px){ .cal-cell{min-height:58px;font-size:10px;padding:4px} .cal-chip{font-size:9px;padding:1px 4px} }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <form class="login-card" id="loginForm">
    <div class="logo">Pack<span>Track</span></div>
    <div class="sub">Panel de administración</div>
    <div id="loginErr" class="err" style="display:none"></div>
    <div class="field">
      <label>Correo</label>
      <input type="email" id="email" placeholder="admin@packtrack.com" autocomplete="username" required />
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
    </div>
    <button class="btn btn-block" id="loginBtn" type="submit">Iniciar sesión</button>
  </form>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Pack<span>Track</span></div>
      <nav class="nav" id="nav">
        <div class="nav-item active" data-view="overview"><span class="ico"></span> Resumen</div>
        <div class="nav-item" data-view="packages"><span class="ico"></span> Paquetes</div>
        <div class="nav-item" data-view="residents"><span class="ico"></span> Residentes</div>
        <div class="nav-item" data-view="guards"><span class="ico"></span> Guardias</div>
        <div class="nav-item" data-view="amenities"><span class="ico"></span> Amenidades</div>
        <div class="nav-item" data-view="visits"><span class="ico"></span> Visitas</div>
        <div class="nav-item" data-view="buildings"><span class="ico"></span> Edificios</div>
      </nav>
      <div class="foot">PackTrack Admin · dev<br/>v1.0</div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="hamburger" aria-label="Menú"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <div class="bsel">
            <span class="muted" style="font-size:13px;font-weight:600">Edificio:</span>
            <select id="buildingSel"></select>
          </div>
        </div>
        <div class="user">
          <span id="userEmail"></span>
          <div class="avatar" id="avatar">A</div>
          <button class="btn btn-ghost btn-sm" id="logoutBtn">Salir</button>
        </div>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG  (valores públicos de cliente — no secretos)
   ============================================================ */
const CFG = {
  region: "us-east-1",
  clientId: "54mfccmv0tuaopput64vqj74pc",
  cognito: "https://cognito-idp.us-east-1.amazonaws.com/",
  graphql: "https://rm7ud7ae3nc4zpsl5s6wlxmtbq.appsync-api.us-east-1.amazonaws.com/graphql",
};
const STATUSES = ["RECIBIDO","NOTIFICADO","ENTREGADO","DEVUELTO","EXPIRADO"];
const STATUS_LABEL = {RECIBIDO:"Recibido",NOTIFICADO:"Notificado",ENTREGADO:"Entregado",DEVUELTO:"Devuelto",EXPIRADO:"Expirado"};
const STATUS_COLOR = {RECIBIDO:"#2563eb",NOTIFICADO:"#d97706",ENTREGADO:"#16a34a",DEVUELTO:"#475569",EXPIRADO:"#dc2626"};

/* ============================================================
   STATE
   ============================================================ */
const S = {
  idToken: localStorage.getItem("pt_idToken") || null,
  email: localStorage.getItem("pt_email") || null,
  buildings: [],
  building: null,      // selected building id
  towers: [],
  units: [],
  residents: [],
  guards: [],
  amenities: [],
  calMonth: null,
  view: "overview",
};

/* ============================================================
   AUTH
   ============================================================ */
async function cognitoLogin(email, password){
  const res = await fetch(CFG.cognito, {
    method:"POST",
    headers:{"Content-Type":"application/x-amz-json-1.1","X-Amz-Target":"AWSCognitoIdentityProviderService.InitiateAuth"},
    body: JSON.stringify({
      AuthFlow:"USER_PASSWORD_AUTH", ClientId: CFG.clientId,
      AuthParameters:{ USERNAME: email, PASSWORD: password }
    })
  });
  const data = await res.json();
  if(!res.ok){ throw new Error(data.message || data.__type || "Error de autenticación"); }
  if(data.ChallengeName){ throw new Error("Se requiere paso adicional: "+data.ChallengeName); }
  return data.AuthenticationResult.IdToken;
}

function logout(){
  localStorage.removeItem("pt_idToken");
  localStorage.removeItem("pt_email");
  S.idToken=null; S.email=null;
  location.reload();
}

/* ============================================================
   GRAPHQL CLIENT
   ============================================================ */
async function gql(query, variables={}){
  const res = await fetch(CFG.graphql, {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization": S.idToken},
    body: JSON.stringify({query, variables})
  });
  const data = await res.json();
  if(data.errors){
    const msg = data.errors.map(e=>e.message).join("; ");
    if(/UnauthorizedException|token|expired/i.test(msg)){ toast("Sesión expirada","err"); setTimeout(logout,1200); }
    throw new Error(msg);
  }
  return data.data;
}

/* ---- Queries ---- */
const Q = {
  listBuildings: `query{ listBuildings(limit:100){ items{ id name address createdAt } } }`,
  listTowers: `query($b:ID!){ listTowers(buildingId:$b,limit:200){ items{ id name buildingId } } }`,
  listUnits: `query($b:ID!){ listUnits(buildingId:$b,limit:500){ items{ id number towerId towerName } } }`,
  listResidents: `query($b:ID!){ listResidents(buildingId:$b,limit:500){ items{ id fullName phone email towerName unitNumber towerId unitId createdAt } } }`,
  listGuards: `query($b:ID!){ listGuards(buildingId:$b){ items{ id fullName email phone status createdAt } } }`,
  listPackages: `query($b:ID!,$s:PackageStatus!){ listPackagesByStatus(buildingId:$b,status:$s,limit:200){ items{ id residentName recipientName towerName unitNumber carrier trackingNumber pickupCode status receivedByName createdAt deliveredAt } } }`,
  listAmenities: `query($b:ID!){ listAmenities(buildingId:$b){ items{ id name category capacity slotMinutes openTime closeTime days status } } }`,
  listReservations: `query($b:ID!,$f:String!,$t:String!){ listReservations(buildingId:$b,fromDate:$f,toDate:$t){ items{ id amenityName residentName towerName unitNumber date startTime endTime } } }`,
  listActiveVisits: `query($b:ID!){ listActiveVisits(buildingId:$b){ items{ id visitorName towerName unitNumber checkInAt } } }`,
};
const M = {
  createBuilding: `mutation($i:CreateBuildingInput!){ createBuilding(input:$i){ id } }`,
  updateBuilding: `mutation($i:UpdateBuildingInput!){ updateBuilding(input:$i){ id } }`,
  deleteBuilding: `mutation($id:ID!){ deleteBuilding(id:$id) }`,
  createTower: `mutation($i:CreateTowerInput!){ createTower(input:$i){ id } }`,
  createUnit: `mutation($i:CreateUnitInput!){ createUnit(input:$i){ id } }`,
  createResident: `mutation($i:CreateResidentInput!){ createResident(input:$i){ id } }`,
  updateResident: `mutation($i:UpdateResidentInput!){ updateResident(input:$i){ id } }`,
  deleteResident: `mutation($b:ID!,$r:ID!){ deleteResident(buildingId:$b,residentId:$r) }`,
  createGuard: `mutation($i:CreateGuardInput!){ createGuard(input:$i){ id fullName } }`,
  deleteGuard: `mutation($u:String!){ deleteGuard(username:$u) }`,
  createAmenity: `mutation($i:CreateAmenityInput!){ createAmenity(input:$i){ id } }`,
  updateAmenity: `mutation($i:UpdateAmenityInput!){ updateAmenity(input:$i){ id } }`,
  setAmenityStatus: `mutation($b:ID!,$a:ID!,$s:AmenityStatus!){ setAmenityStatus(buildingId:$b,amenityId:$a,status:$s){ id status } }`,
  deleteAmenity: `mutation($b:ID!,$a:ID!){ deleteAmenity(buildingId:$b,amenityId:$a) }`,
  cancelReservation: `mutation($b:ID!,$r:ID!){ cancelReservation(buildingId:$b,reservationId:$r) }`,
};

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s=>document.querySelector(s);
const esc = s=> (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- Iconos SVG monocromáticos (estilo Feather, heredan currentColor) ---- */
const ICONS = {
  overview:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  package:'<path d="M16.5 9.4 7.55 4.24"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  alert:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
};
function icon(name, size){ size=size||18; return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.18em">${ICONS[name]||''}</svg>`; }
const NAV_ICON = { overview:'overview', packages:'package', residents:'users', guards:'shield', amenities:'calendar', visits:'user', buildings:'home' };
document.querySelectorAll('.nav-item').forEach(n=>{ const ic=n.querySelector('.ico'); if(ic) ic.innerHTML=icon(NAV_ICON[n.dataset.view]||'package',18); });

function fmtDate(d){ if(!d) return "—"; const x=new Date(d); return x.toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"}); }
function badge(status){ return `<span class="badge b-${status.toLowerCase()}"><span class="dot" style="background:${STATUS_COLOR[status]}"></span>${STATUS_LABEL[status]||status}</span>`; }
function toast(msg, type){ const t=$("#toast"); t.textContent=msg; t.className="toast show"+(type==="err"?" err":""); setTimeout(()=>t.className="toast",2600); }

function openModal(title, bodyHtml, footHtml){
  $("#modalTitle").textContent=title; $("#modalBody").innerHTML=bodyHtml;
  $("#modalFoot").innerHTML=footHtml; $("#modalBg").classList.add("show");
}
function closeModal(){ $("#modalBg").classList.remove("show"); }

async function loadBuildings(){
  const d = await gql(Q.listBuildings);
  S.buildings = d.listBuildings.items || [];
  if(!S.building && S.buildings.length) S.building = S.buildings[0].id;
}
async function loadBuildingData(){
  if(!S.building){ S.towers=[];S.units=[];S.residents=[];S.guards=[]; return; }
  const [t,u,r,g] = await Promise.all([
    gql(Q.listTowers,{b:S.building}),
    gql(Q.listUnits,{b:S.building}),
    gql(Q.listResidents,{b:S.building}),
    gql(Q.listGuards,{b:S.building}).catch(()=>({listGuards:{items:[]}})),
  ]);
  S.towers = t.listTowers.items||[];
  S.units = u.listUnits.items||[];
  S.residents = r.listResidents.items||[];
  S.guards = g.listGuards.items||[];
}

/* ---- CSV IMPORT (residentes) ---- */
function parseCSV(text){
  text = text.replace(/^﻿/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  // Detectar delimitador (coma o punto y coma)
  const firstLine = text.split("\n")[0]||"";
  const delim = (firstLine.split(";").length > firstLine.split(",").length) ? ";" : ",";
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=c;
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function onCsvSelected(ev){
  const file=ev.target.files[0]; ev.target.value="";
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>csvPreview(parseCSV(reader.result));
  reader.readAsText(file);
}
function norm(s){ return (s||"").toString().trim(); }
function csvPreview(rows){
  if(rows.length<2){ toast("CSV vacío o sin filas de datos","err"); return; }
  // Mapear encabezados
  const header = rows[0].map(h=>norm(h).toLowerCase());
  const idx = (names)=> header.findIndex(h=> names.some(n=>h.includes(n)));
  const iName=idx(["nombre","name","fullname"]), iTower=idx(["torre","tower"]),
        iUnit=idx(["unidad","unit","depto","apto"]), iEmail=idx(["email","correo","mail"]),
        iPhone=idx(["tel","phone","cel","celular"]);
  if(iName<0||iEmail<0){ toast("El CSV debe tener al menos columnas de nombre y email","err"); return; }
  const data = rows.slice(1).map(r=>({
    fullName:norm(r[iName]), tower:iTower>=0?norm(r[iTower]):"",
    unit:iUnit>=0?norm(r[iUnit]):"", email:iEmail>=0?norm(r[iEmail]):"",
    phone:iPhone>=0?norm(r[iPhone]):"",
  })).filter(d=>d.fullName&&d.email);
  if(!data.length){ toast("No se encontraron filas válidas (nombre + email)","err"); return; }
  window.__csvData=data;
  openModal(`Importar ${data.length} residentes`, `
    <div class="muted" style="margin-bottom:14px;font-size:13px">Se crearán residentes y su acceso a la app (invitación por email). Las torres y unidades que no existan se crean automáticamente.</div>
    <div style="max-height:280px;overflow:auto;border:1px solid var(--border);border-radius:8px">
      <table><thead><tr><th>Nombre</th><th>Torre</th><th>Unidad</th><th>Email</th></tr></thead>
      <tbody>${data.slice(0,50).map(d=>`<tr><td>${esc(d.fullName)}</td><td class="muted">${esc(d.tower)}</td><td class="muted">${esc(d.unit)}</td><td class="muted">${esc(d.email)}</td></tr>`).join("")}</tbody></table>
    </div>
    ${data.length>50?`<div class="muted" style="font-size:12px;margin-top:8px">…y ${data.length-50} más</div>`:""}
    <div id="csvProgress" style="margin-top:14px"></div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" id="csv_run">Importar ${data.length}</button>`);
  $("#csv_run").onclick=runCsvImport;
}
async function runCsvImport(){
  const data=window.__csvData||[];
  $("#csv_run").disabled=true;
  const prog=$("#csvProgress");
  let ok=0, fail=0; const errors=[];
  // Cachés locales mutables de torres/unidades
  const towers=[...S.towers], units=[...S.units];
  const findTower=(n)=> towers.find(t=>t.name.toLowerCase()===n.toLowerCase());
  const findUnit=(tid,num)=> units.find(u=>u.towerId===tid && (u.number||"").toLowerCase()===num.toLowerCase());
  for(let i=0;i<data.length;i++){
    const d=data[i];
    prog.innerHTML=`<div class="muted">Procesando ${i+1}/${data.length}… ✓${ok} ✗${fail}</div>`;
    try{
      let towerId=null, unitId=null;
      if(d.tower){
        let t=findTower(d.tower);
        if(!t){ const res=await gql(M.createTower,{i:{buildingId:S.building,name:d.tower}}); t={id:res.createTower.id,name:d.tower}; towers.push(t); }
        towerId=t.id;
        const unitNum=d.unit||"S/N";
        let u=findUnit(towerId,unitNum);
        if(!u){ const res=await gql(M.createUnit,{i:{buildingId:S.building,towerId,number:unitNum}}); u={id:res.createUnit.id,towerId,number:unitNum}; units.push(u); }
        unitId=u.id;
      }
      if(!towerId||!unitId){ throw new Error("Fila sin torre/unidad (se requiere para residentes)"); }
      await gql(M.createResident,{i:{buildingId:S.building,towerId,unitId,fullName:d.fullName,email:d.email,phone:d.phone||null}});
      ok++;
    }catch(e){ fail++; errors.push(`${d.fullName}: ${e.message}`); }
  }
  prog.innerHTML=`<div style="font-weight:600;color:var(--green)">✓ ${ok} importados</div>${fail?`<div style="color:var(--red);font-size:13px;margin-top:6px">✗ ${fail} con error:<br/>${errors.slice(0,8).map(esc).join("<br/>")}</div>`:""}`;
  $("#csv_run").textContent="Cerrar"; $("#csv_run").disabled=false;
  $("#csv_run").onclick=async()=>{ closeModal(); await loadBuildingData(); render(); };
}

  setLoading();
  try{ const a=await gql(Q.listAmenities,{b:S.building}); S.amenities=a.listAmenities.items||[]; }
  catch(e){ $("#content").innerHTML=`<div class="card"><div class="card-body">${emptyHtml("alert",e.message)}</div></div>`; return; }
  if(!S.calMonth){ const d=new Date(); S.calMonth={y:d.getFullYear(),m:d.getMonth()}; }
  $("#content").innerHTML = `
    <div class="page-title">Amenidades</div>
    <div class="page-sub">${S.amenities.length} amenidades · reserva por bloques fijos</div>
    <div class="card">
      <div class="card-head"><h3>Amenidades del edificio</h3>
        <button class="btn btn-sm" onclick="amenityForm()">+ Nueva amenidad</button></div>
      <div class="card-body">
        ${S.amenities.length? `<table>
          <thead><tr><th>Nombre</th><th>Horario</th><th>Bloque</th><th>Cupo</th><th>Estado</th><th></th></tr></thead>
          <tbody>${S.amenities.map(amenityRow).join("")}</tbody></table>` : emptyHtml("calendar","Crea tu primera amenidad")}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Calendario de reservas</h3>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn btn-ghost btn-sm" onclick="calMove(-1)">‹</button>
          <strong id="calLabel" style="min-width:140px;text-align:center"></strong>
          <button class="btn btn-ghost btn-sm" onclick="calMove(1)">›</button>
        </div></div>
      <div class="card-body" style="padding:16px"><div id="calWrap"><div class="loading"><div class="spinner"></div></div></div></div>
    </div>`;
  renderCalendar();
}

function amenityRow(am){
  const days=(am.days||[]).slice().sort().map(d=>DAY_SHORT[d]).join(" ");
  const active = am.status==="ACTIVE";
  return `<tr>
    <td><strong>${esc(am.name)}</strong>${am.category?`<br/><span class="muted" style="font-size:12px">${esc(am.category)}</span>`:""}</td>
    <td class="muted">${esc(am.openTime)}–${esc(am.closeTime)}<br/><span style="font-size:12px">${days}</span></td>
    <td class="muted">${am.slotMinutes} min</td>
    <td class="muted">${am.capacity}</td>
    <td>${active?'<span class="badge b-entregado"><span class="dot" style="background:var(--green)"></span>Activa</span>':'<span class="badge b-expirado"><span class="dot" style="background:var(--red)"></span>Fuera de servicio</span>'}</td>
    <td><div class="row-actions">
      <button class="btn btn-ghost btn-sm" onclick='amenityForm(${JSON.stringify(am)})'>Editar</button>
      <button class="btn btn-ghost btn-sm" onclick="toggleAmenity('${am.id}','${active?'OUT_OF_SERVICE':'ACTIVE'}')">${active?'Fuera de servicio':'Activar'}</button>
      <button class="btn btn-danger btn-sm" onclick="delAmenity('${am.id}','${esc(am.name)}')">Eliminar</button>
    </div></td>
  </tr>`;
}

function amenityForm(am){
  const isEdit=!!am; am=am||{days:[1,2,3,4,5,6,0]};
  const sel=new Set(am.days||[]);
  openModal(isEdit?"Editar amenidad":"Nueva amenidad",`
    <div class="field"><label>Nombre</label><input id="a_name" value="${esc(am.name||"")}" placeholder="Alberca, Salón, Cancha, Cine..."/></div>
    <div class="field"><label>Categoría</label><input id="a_cat" value="${esc(am.category||"")}" placeholder="Alberca / Salón / Deporte..."/></div>
    <div style="display:flex;gap:10px">
      <div class="field" style="flex:1"><label>Abre</label><input id="a_open" type="time" value="${esc(am.openTime||"08:00")}"/></div>
      <div class="field" style="flex:1"><label>Cierra</label><input id="a_close" type="time" value="${esc(am.closeTime||"22:00")}"/></div>
    </div>
    <div style="display:flex;gap:10px">
      <div class="field" style="flex:1"><label>Duración bloque (min)</label><input id="a_slot" type="number" min="5" step="5" value="${am.slotMinutes||60}"/></div>
      <div class="field" style="flex:1"><label>Cupo por bloque</label><input id="a_cap" type="number" min="1" value="${am.capacity||1}"/></div>
    </div>
    <div class="field"><label>Días disponibles</label>
      <div id="a_days" style="display:flex;gap:6px;flex-wrap:wrap">
        ${DAY_LABELS.map(([v,l])=>`<label style="display:flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer"><input type="checkbox" value="${v}" ${sel.has(+v)?"checked":""}/> ${l}</label>`).join("")}
      </div></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn" id="a_save">Guardar</button>`);
  $("#a_save").onclick=async()=>{
    const name=$("#a_name").value.trim();
    if(!name){ toast("El nombre es obligatorio","err"); return; }
    const days=[...document.querySelectorAll('#a_days input:checked')].map(c=>+c.value);
    if(!days.length){ toast("Selecciona al menos un día","err"); return; }
    if($("#a_close").value <= $("#a_open").value){ toast("El cierre debe ser después de la apertura","err"); return; }
    const data={ name, category:$("#a_cat").value.trim()||null, capacity:+$("#a_cap").value, slotMinutes:+$("#a_slot").value, openTime:$("#a_open").value, closeTime:$("#a_close").value, days };
    $("#a_save").disabled=true;
    try{
      if(isEdit) await gql(M.updateAmenity,{i:{id:am.id,buildingId:S.building,...data}});
      else await gql(M.createAmenity,{i:{buildingId:S.building,...data}});
      closeModal(); toast("Amenidad guardada"); renderAmenities();
    }catch(e){ toast(e.message,"err"); $("#a_save").disabled=false; }
  };
}
async function toggleAmenity(id,status){ try{ await gql(M.setAmenityStatus,{b:S.building,a:id,s:status}); toast("Estado actualizado"); renderAmenities(); }catch(e){ toast(e.message,"err"); } }
async function delAmenity(id,name){ if(!confirm(`¿Eliminar "${name}"? Las reservas existentes se conservan.`)) return; try{ await gql(M.deleteAmenity,{b:S.building,a:id}); toast("Amenidad eliminada"); renderAmenities(); }catch(e){ toast(e.message,"err"); } }

/* ---- Calendar ---- */
function calMove(d){ let {y,m}=S.calMonth; m+=d; if(m<0){m=11;y--;} if(m>11){m=0;y++;} S.calMonth={y,m}; renderCalendar(); }
async function renderCalendar(){
  const {y,m}=S.calMonth, pad=n=>String(n).padStart(2,"0");
  $("#calLabel").textContent=`${MONTHS[m]} ${y}`;
  const last=new Date(y,m+1,0).getDate();
  const from=`${y}-${pad(m+1)}-01`, to=`${y}-${pad(m+1)}-${pad(last)}`;
  let items=[];
  try{ const r=await gql(Q.listReservations,{b:S.building,f:from,t:to}); items=r.listReservations.items||[]; }
  catch(e){ $("#calWrap").innerHTML=`<div class="muted">${esc(e.message)}</div>`; return; }
  const byDay={}; items.forEach(r=>{ (byDay[r.date]=byDay[r.date]||[]).push(r); });
  S._resByDay=byDay;
  const firstDow=new Date(y,m,1).getDay();
  const todayStr=(()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;})();
  let cells="";
  for(let i=0;i<firstDow;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=last;d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`;
    const rs=(byDay[ds]||[]).slice().sort((a,b)=>a.startTime.localeCompare(b.startTime));
    const chips=rs.slice(0,3).map(r=>`<div class="cal-chip" title="${esc(r.amenityName)} · ${esc(r.startTime)} · ${esc(r.residentName)}">${esc(r.startTime)} ${esc(r.amenityName)}</div>`).join("");
    const more=rs.length>3?`<div class="cal-more">+${rs.length-3} más</div>`:"";
    cells+=`<div class="cal-cell${rs.length?' has':''}${ds===todayStr?' today':''}" ${rs.length?`onclick="calDay('${ds}')"`:""}><div class="cal-d">${d}</div>${chips}${more}</div>`;
  }
  $("#calWrap").innerHTML=`<div class="cal-head">${["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].map(n=>`<div>${n}</div>`).join("")}</div><div class="cal-grid">${cells}</div>`;
}
function calDay(ds){
  const rs=((S._resByDay||{})[ds]||[]).slice().sort((a,b)=>a.startTime.localeCompare(b.startTime));
  const body=rs.length? rs.map(r=>`
    <div style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>${esc(r.amenityName)}</strong><span class="code">${esc(r.startTime)}–${esc(r.endTime)}</span>
      </div>
      <div class="muted" style="font-size:13px;margin-top:4px">${esc(r.residentName)} · ${esc(r.towerName||"")} ${esc(r.unitNumber||"")}</div>
      <button class="btn btn-danger btn-sm" style="margin-top:9px" onclick="adminCancel('${r.id}','${esc(r.residentName)}')">Cancelar reserva</button>
    </div>`).join("") : '<div class="muted">Sin reservas</div>';
  openModal(`Reservas · ${ds}`, body, `<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`);
}
async function adminCancel(id,who){
  if(!confirm(`¿Cancelar la reserva de ${who}?`)) return;
  try{ await gql(M.cancelReservation,{b:S.building,r:id}); toast("Reserva cancelada"); closeModal(); renderAmenities(); }catch(e){ toast(e.message,"err"); }
}

/* ---- VISITS (visitantes activos por torre) ---- */
function fmtTime(d){ if(!d) return "—"; return new Date(d).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}); }
async function renderVisits(){
  if(!S.building){ return emptyState("user","Selecciona un edificio para ver visitas"); }
  setLoading();
  let items=[];
  try{ const d=await gql(Q.listActiveVisits,{b:S.building}); items=d.listActiveVisits.items||[]; }
  catch(e){ $("#content").innerHTML=`<div class="empty">Error: ${esc(e.message)}</div>`; return; }

  // Group by tower name
  const groups={};
  items.forEach(v=>{ const t=v.towerName||"Sin torre"; (groups[t]=groups[t]||[]).push(v); });
  const towerNames=Object.keys(groups).sort((a,b)=>a.localeCompare(b));

  const head = `
    <div class="page-title">Visitas activas</div>
    <div class="page-sub">${items.length} visitante${items.length===1?"":"s"} dentro del edificio · agrupados por torre</div>`;

  if(!items.length){ $("#content").innerHTML = head + `<div class="card"><div class="card-body">${emptyHtml("user","Sin visitantes activos")}</div></div>`; return; }

  const body = towerNames.map(t=>`
    <div class="card">
      <div class="card-head"><h3>${esc(t)} · ${groups[t].length}</h3></div>
      <div class="card-body"><table>
        <thead><tr><th>Visitante</th><th>Depto</th><th>Entrada</th></tr></thead>
        <tbody>${groups[t].map(v=>`<tr>
          <td><strong>${esc(v.visitorName)}</strong></td>
          <td class="muted">${esc(v.unitNumber||"—")}</td>
          <td class="muted">${fmtDate(v.checkInAt)} ${fmtTime(v.checkInAt)}</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>`).join("");

  $("#content").innerHTML = head + body;
}

/* ---- empty helpers ---- */
function emptyHtml(ico,msg){ return `<div class="empty"><div class="big" style="color:var(--border)">${icon(ico,40)}</div>${esc(msg)}</div>`; }
function emptyState(ico,msg){ $("#content").innerHTML=`<div class="card"><div class="card-body">${emptyHtml(ico,msg)}</div></div>`; }

/* ============================================================
   NAV / BOOT
   ============================================================ */
document.querySelectorAll(".nav-item").forEach(n=>n.onclick=()=>{
  document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
  n.classList.add("active"); S.view=n.dataset.view; render();
});
$("#buildingSel").onchange = async e=>{ S.building=e.target.value; setLoading(); await loadBuildingData(); render(); };
$("#logoutBtn").onclick = logout;

/* ---- Sidebar responsive (off-canvas en móvil) ---- */
const sidebarEl = document.querySelector(".sidebar");
const overlayEl = $("#sidebarOverlay");
function closeSidebar(){ sidebarEl.classList.remove("open"); overlayEl.classList.remove("show"); }
$("#hamburger").onclick = ()=>{ sidebarEl.classList.add("open"); overlayEl.classList.add("show"); };
overlayEl.onclick = closeSidebar;
document.querySelectorAll(".nav-item").forEach(n=> n.addEventListener("click", closeSidebar));

$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=$("#loginBtn"), errBox=$("#loginErr");
  errBox.style.display="none"; btn.disabled=true; btn.textContent="Ingresando…";
  try{
    const token = await cognitoLogin($("#email").value.trim(), $("#password").value);
    S.idToken=token; S.email=$("#email").value.trim();
    localStorage.setItem("pt_idToken",token); localStorage.setItem("pt_email",S.email);
    await boot();
  }catch(err){
    errBox.textContent = err.message; errBox.style.display="block";
    btn.disabled=false; btn.textContent="Iniciar sesión";
  }
});

async function boot(){
  $("#login").style.display="none";
  $("#app").style.display="block";
  $("#userEmail").textContent=S.email||"";
  $("#avatar").textContent=(S.email||"A")[0].toUpperCase();
  setLoading();
  try{
    await loadBuildings();
    await loadBuildingData();
    render();
  }catch(e){
    if(/Unauthorized|token|expired/i.test(e.message)){ logout(); return; }
    $("#content").innerHTML=`<div class="empty"><div class="big" style="color:var(--border)">${icon('alert',40)}</div>${esc(e.message)}</div>`;
  }
}

// auto-login si hay token guardado
if(S.idToken){ boot(); }
</script>
</body>
</html>
