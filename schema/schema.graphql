# ============================================================
# PackTrack — GraphQL Schema (Source of Truth)
# ============================================================
# This file is the single source of truth for the API contract.
# It is loaded by the AppSync Terraform module at deploy time.
# ============================================================

# ============================================================
# ENUMS
# ============================================================

enum PackageStatus {
  RECIBIDO
  NOTIFICADO
  ENTREGADO
  DEVUELTO
  EXPIRADO
}

enum UserRole {
  GUARD
  RESIDENT
  ADMIN
}

# ============================================================
# TYPES
# ============================================================

type Building {
  id: ID!
  name: String!
  address: String!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Tower {
  id: ID!
  buildingId: ID!
  name: String!
  createdAt: AWSDateTime!
}

type Unit {
  id: ID!
  buildingId: ID!
  towerId: ID!
  number: String!
  towerName: String
  createdAt: AWSDateTime!
}

type Resident {
  id: ID!
  buildingId: ID!
  towerId: ID!
  unitId: ID!
  cognitoUserId: String
  fullName: String!
  nameNormalized: String!
  phone: String
  email: String
  towerName: String
  unitNumber: String
  createdAt: AWSDateTime!
}

type Package {
  id: ID!
  buildingId: ID!
  towerId: ID!
  unitId: ID!
  residentId: ID!
  residentName: String!
  towerName: String
  unitNumber: String
  status: PackageStatus!
  carrier: String
  trackingNumber: String
  labelPhotoKey: String
  labelPhotoUrl: String
  evidencePhotoKey: String
  evidencePhotoUrl: String
  pickupCode: String!
  ocrRawData: AWSJSON
  registeredBy: String!
  receivedByName: String
  deliveredBy: String
  deliveredAt: AWSDateTime
  notifiedAt: AWSDateTime
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  expiresAt: AWSDateTime
}

type Guard {
  id: ID!
  fullName: String!
  email: String!
  phone: String
  buildingId: ID
  status: String
  createdAt: AWSDateTime
}

enum AmenityStatus {
  ACTIVE
  OUT_OF_SERVICE
}

type Amenity {
  id: ID!
  buildingId: ID!
  name: String!
  category: String
  description: String
  capacity: Int!
  slotMinutes: Int!
  openTime: String!
  closeTime: String!
  days: [Int!]!
  status: AmenityStatus!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Reservation {
  id: ID!
  buildingId: ID!
  amenityId: ID!
  amenityName: String!
  residentId: ID!
  residentName: String!
  towerName: String
  unitNumber: String
  date: String!
  startTime: String!
  endTime: String!
  guests: Int
  createdAt: AWSDateTime!
}

type AmenitySlot {
  startTime: String!
  endTime: String!
  capacity: Int!
  reserved: Int!
  available: Int!
}

enum VisitStatus {
  ACTIVE
  ENDED
}

type Visit {
  id: ID!
  buildingId: ID!
  visitorName: String!
  towerId: ID!
  towerName: String
  unitId: ID!
  unitNumber: String
  residentId: ID
  status: VisitStatus!
  badgeToken: String!
  checkInAt: AWSDateTime!
  checkOutAt: AWSDateTime
  registeredBy: String!
}

# Public payload for the visitor's virtual badge (no sensitive PII).
type VisitBadge @aws_api_key @aws_cognito_user_pools {
  visitorName: String!
  towerName: String
  unitNumber: String
  status: VisitStatus!
  badgeToken: String!
}

type OCRResult {
  suggestedName: String
  suggestedTowerName: String
  suggestedUnitNumber: String
  suggestedTrackingNumber: String
  suggestedCarrier: String
  # Plausible name lines detected on an ID, for the guard to tap when the
  # auto-detected name is wrong (docType: "id"). Empty for package labels.
  nameCandidates: [String!]
  rawText: String
  confidence: Float
}

type UploadUrl {
  uploadUrl: String!
  key: String!
  expiresIn: Int!
}

type NotificationRecord {
  id: ID!
  packageId: ID!
  residentId: ID!
  channel: String!
  status: String!
  payload: AWSJSON
  sentAt: AWSDateTime!
}

# ============================================================
# CONNECTIONS (Pagination)
# ============================================================

type PackageConnection {
  items: [Package!]!
  nextToken: String
}

type ResidentConnection {
  items: [Resident!]!
  nextToken: String
}

type BuildingConnection {
  items: [Building!]!
  nextToken: String
}

type GuardConnection {
  items: [Guard!]!
  nextToken: String
}

type AmenityConnection {
  items: [Amenity!]!
  nextToken: String
}

type ReservationConnection {
  items: [Reservation!]!
  nextToken: String
}

type VisitConnection {
  items: [Visit!]!
  nextToken: String
}

type TowerConnection {
  items: [Tower!]!
  nextToken: String
}

type UnitConnection {
  items: [Unit!]!
  nextToken: String
}

# ============================================================
# INPUTS
# ============================================================

input RegisterPackageInput {
  buildingId: ID!
  towerId: ID!
  unitId: ID!
  residentId: ID!
  carrier: String
  trackingNumber: String
  labelPhotoKey: String
  # Name of the guard who received the package (manual, remembered client-side).
  receivedByName: String
}

input ConfirmPickupInput {
  buildingId: ID!
  packageId: ID!
  pickupCode: String!
  evidencePhotoKey: String
}

input ProcessLabelInput {
  s3Key: String!
  # "label" (default) for package labels, "id" for visitor ID cards.
  docType: String
}

input CreateBuildingInput {
  name: String!
  address: String!
}

input UpdateBuildingInput {
  id: ID!
  name: String
  address: String
}

input CreateTowerInput {
  buildingId: ID!
  name: String!
}

input CreateUnitInput {
  buildingId: ID!
  towerId: ID!
  number: String!
}

input CreateResidentInput {
  buildingId: ID!
  towerId: ID!
  unitId: ID!
  fullName: String!
  phone: String
  email: String
}

input UpdateResidentInput {
  id: ID!
  buildingId: ID!
  fullName: String
  phone: String
  email: String
}

input GetUploadUrlInput {
  buildingId: ID!
  fileExtension: String!
  purpose: String!
}

input CreateGuardInput {
  buildingId: ID!
  fullName: String!
  email: String!
  phone: String
}

input CreateAmenityInput {
  buildingId: ID!
  name: String!
  category: String
  description: String
  capacity: Int!
  slotMinutes: Int!
  openTime: String!
  closeTime: String!
  days: [Int!]!
}

input UpdateAmenityInput {
  id: ID!
  buildingId: ID!
  name: String
  category: String
  description: String
  capacity: Int
  slotMinutes: Int
  openTime: String
  closeTime: String
  days: [Int!]
}

input CreateReservationInput {
  buildingId: ID!
  amenityId: ID!
  residentId: ID!
  date: String!
  startTime: String!
  guests: Int
}

input CheckInVisitInput {
  buildingId: ID!
  visitorName: String!
  towerId: ID!
  unitId: ID!
  residentId: ID
}

# ============================================================
# QUERIES
# ============================================================

type Query {
  # --- Packages ---
  getPackage(buildingId: ID!, packageId: ID!): Package

  listPackagesByStatus(
    buildingId: ID!
    status: PackageStatus!
    limit: Int
    nextToken: String
  ): PackageConnection!

  listMyPackages(
    residentId: ID!
    limit: Int
    nextToken: String
  ): PackageConnection!

  verifyPickupCode(code: String!): Package

  # --- Buildings / Admin ---
  getBuilding(id: ID!): Building
  listBuildings(limit: Int, nextToken: String): BuildingConnection!

  listTowers(buildingId: ID!, limit: Int, nextToken: String): TowerConnection!
  listUnits(
    buildingId: ID!
    towerId: ID
    limit: Int
    nextToken: String
  ): UnitConnection!

  # --- Guards (staff) ---
  listGuards(buildingId: ID!): GuardConnection!

  # --- Residents ---
  listResidents(
    buildingId: ID!
    limit: Int
    nextToken: String
  ): ResidentConnection!

  searchResidents(
    buildingId: ID!
    query: String!
    limit: Int
  ): ResidentConnection!

  # --- Amenities ---
  listAmenities(buildingId: ID!): AmenityConnection!
  getAmenityAvailability(buildingId: ID!, amenityId: ID!, date: String!): [AmenitySlot!]!
  listMyReservations(residentId: ID!, includePast: Boolean): ReservationConnection!
  listReservations(buildingId: ID!, fromDate: String!, toDate: String!): ReservationConnection!

  # --- Visits ---
  listActiveVisits(buildingId: ID!): VisitConnection!
  # Public: resolves the virtual badge by its unguessable token.
  getVisitBadge(token: String!): VisitBadge @aws_api_key @aws_cognito_user_pools
}

# ============================================================
# MUTATIONS
# ============================================================

type Mutation {
  # --- Packages (Guard) ---
  registerPackage(input: RegisterPackageInput!): Package!
  confirmPickup(input: ConfirmPickupInput!): Package!
  markPackageReturned(buildingId: ID!, packageId: ID!): Package!

  # --- OCR ---
  processLabel(input: ProcessLabelInput!): OCRResult!

  # --- S3 ---
  getUploadUrl(input: GetUploadUrlInput!): UploadUrl!

  # --- Admin CRUD ---
  createBuilding(input: CreateBuildingInput!): Building!
  updateBuilding(input: UpdateBuildingInput!): Building!
  deleteBuilding(id: ID!): ID!

  createTower(input: CreateTowerInput!): Tower!
  deleteTower(buildingId: ID!, towerId: ID!): ID!

  createUnit(input: CreateUnitInput!): Unit!
  deleteUnit(buildingId: ID!, unitId: ID!): ID!

  createResident(input: CreateResidentInput!): Resident!
  updateResident(input: UpdateResidentInput!): Resident!
  deleteResident(buildingId: ID!, residentId: ID!): ID!

  # --- Guards (staff Cognito users) ---
  createGuard(input: CreateGuardInput!): Guard!
  deleteGuard(username: String!): ID!

  # --- Amenities (admin) ---
  createAmenity(input: CreateAmenityInput!): Amenity!
  updateAmenity(input: UpdateAmenityInput!): Amenity!
  setAmenityStatus(buildingId: ID!, amenityId: ID!, status: AmenityStatus!): Amenity!
  deleteAmenity(buildingId: ID!, amenityId: ID!): ID!

  # --- Reservations ---
  createReservation(input: CreateReservationInput!): Reservation!
  cancelReservation(buildingId: ID!, reservationId: ID!): ID!

  # --- Visits (Guard) ---
  checkInVisit(input: CheckInVisitInput!): Visit!
  checkOutVisit(token: String!): Visit!

  # --- Notifications ---
  registerPushToken(residentId: ID!, buildingId: ID!, pushToken: String!): Boolean!
}

# ============================================================
# SUBSCRIPTIONS
# ============================================================

type Subscription {
  onPackageRegistered(buildingId: ID!): Package
    @aws_subscribe(mutations: ["registerPackage"])

  onPackagePickedUp(buildingId: ID!): Package
    @aws_subscribe(mutations: ["confirmPickup"])

  onMyPackageUpdated(residentId: ID!): Package
    @aws_subscribe(mutations: ["registerPackage", "confirmPickup", "markPackageReturned"])
}
